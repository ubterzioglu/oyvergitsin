name: Siyaset Radarı Feed

on:
  schedule:
    - cron: '17 03 * * *'
    - cron: '23 04 * * 0'
  workflow_dispatch:
    inputs:
      cadence:
        description: Tarama sıklığı
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly

permissions:
  contents: read

concurrency:
  group: siyaset-radari-feed
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve cadence
        id: cadence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.cadence }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "23 04 * * 0" ]; then
            echo "value=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "value=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger protected scan endpoint
        env:
          RADAR_BASE_URL: ${{ vars.RADAR_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CADENCE: ${{ steps.cadence.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET repository secret is missing."
            exit 1
          fi
          BASE_URL="${RADAR_BASE_URL:-https://oyvergitsin.org}"
          curl --fail-with-body \
            --silent --show-error \
            --retry 2 --retry-all-errors \
            --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --data "{\"cadence\":\"${CADENCE}\"}" \
            "${BASE_URL%/}/api/cron/siyaset-radari"
