name: Radar News Scan

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger radar scan
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${SITE_URL}/api/cron/radar-scan" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "Radar scan request failed"
            exit 1
          fi
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.RADAR_CRON_SECRET }}
